<style>

.mut{color:var(--mut)} .sm{font-size:14px} .xs{font-size:13px} .b{font-weight:700}

.between{display:flex;justify-content:space-between;align-items:center;gap:8px}

.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:16px;font-size:13px;font-weight:700;border:none;cursor:pointer;white-space:nowrap;flex:none}

.p-ok{background:var(--okbg);color:var(--okfg)} .p-warn{background:var(--warnbg);color:var(--warnfg)} .p-n{background:var(--soft);color:var(--mut)}

label.l{font-size:15px;font-weight:700}

.toast.err{background:var(--bad)}
.busy{position:fixed;top:0;left:0;height:4px;width:40%;background:var(--acc);z-index:70;animation:mv 1s linear infinite}
@keyframes mv{from{left:-40%}to{left:100%}}
.big{font-size:26px;font-weight:800}
.ok-circle{width:72px;height:72px;border-radius:36px;background:var(--ok);display:flex;align-items:center;justify-content:center}
.weeks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.weeks button{min-height:56px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
.weeks button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.weeks button.r:not(.on){border-color:#D97706}
.weeks b{font-size:14px} .weeks span{font-size:11px;font-weight:600}
.conds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.center{text-align:center}
.mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}

.mini span.z{background:transparent;border:1px dashed var(--line2);color:var(--mut)}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 120px 36px;align-items:center;gap:8px;font-size:13px}
.hb .bar{height:12px;border-radius:6px}
.ppcbig{font-size:52px;font-weight:800;line-height:1}
.hide{display:none!important}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
@media (min-width:700px){.body{padding:20px 24px}.top{padding:14px 24px 12px}.foot{padding:12px 24px 16px}}
</style>

<script>
'use strict';
const VERSION = '4.3.0';
const CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>';
const CHEV = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A847A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const BACKI = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
const GEAR = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
const CAM = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const CLIMAS = ['Soleado', 'Nublado', 'Lluvia'];
const EVENTOS = ['Nada especial', 'Paralización', 'Orden del supervisor', 'Faltó material', 'Visita de la entidad', 'Incidente o accidente'];
const SECCIONES = [['avance', 'Avance'], ['personal', 'Personal'], ['equipos', 'Equipos y maquinaria'], ['novedades', 'Clima, novedades y fotos']];
const UNIDADES = ['m²', 'm³', 'ml', 'kg', 'und', 'global'];
const COND_CORTO = { pl: 'Planos', ma: 'Material', mo: 'Personal', eq: 'Equipo', fr: 'Frente', tp: 'Previa', ex: 'Externas' };
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const DIAC = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { const n = Number(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = (n) => (Math.round(num(n) * 100) / 100).toLocaleString('es-BO');
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoyLocal = () => iso(new Date());
const addDays = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const dOf = (f) => new Date(f + 'T12:00:00');
const fLarga = (f) => { const d = dOf(f); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const fCorta = (f) => { const d = dOf(f); return DIAC[d.getDay()] + ' ' + d.getDate(); };
const fMes = (f) => { const d = dOf(f); return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const newId = () => ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 24);
const LS = {
  get(k, d) { try { const v = localStorage.getItem('oa:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('oa:' + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem('oa:' + k); } catch (e) { } },
  keys() { try { return Object.keys(localStorage).filter((k) => k.indexOf('oa:') === 0).map((k) => k.slice(3)); } catch (e) { return []; } },
};

/* ---------- cola de envíos (se guarda en el celular hasta que haya señal) ---------- */
const OB = (() => {
  let dbp = null; const mem = {};
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('obra-app', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('outbox', { keyPath: 'k' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const tx = async (mode, fn) => {
    let db;
    try { db = await open(); } catch (e) { return fn(null); }
    return new Promise((res, rej) => {
      const t = db.transaction('outbox', mode); const st = t.objectStore('outbox'); let out;
      const r = fn(st); if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  };
  return {
    put: (it) => tx('readwrite', (st) => st ? st.put(it) : (mem[it.k] = it, null)),
    del: (k) => tx('readwrite', (st) => st ? st.delete(k) : (delete mem[k], null)),
    all: async () => (await tx('readonly', (st) => st ? st.getAll() : null)) || Object.values(mem),
  };
})();

/* ---------- estado ---------- */
const S = {
  api: LS.get('api', ''), token: LS.get('token', ''), obra: LS.get('obra', ''), data: null, dataFecha: '', view: 'hoy', prev: 'hoy',
  login: { step: 'login', email: LS.get('email', ''), actual: '', forzado: false }, online: navigator.onLine, pend: [], syncing: false, busy: 0,
  sol: null, solOk: null, prog: null, progSem: '', progQ: '', nueva: null, ppc: null, ppcDoc: null, ppcFrom: 'hoy', parteDoc: null, hist: null, histSel: '', installEvt: null, geo: null, enviadoRacha: 0, err: '',
};
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; });

/* ---------- conexión con el sistema (Apps Script) ---------- */
async function api(fn, ...args) {
  let r;
  try {
    r = await fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args, token: S.token }), redirect: 'follow' });
  } catch (e) { const x = new Error('Sin conexión con el sistema.'); x.net = true; throw x; }
  if (!r.ok) { const x = new Error('El sistema respondió con un error (' + r.status + ').'); x.net = r.status >= 500 || r.status === 429; throw x; }
  let j;
  try { j = await r.json(); } catch (e) { const x = new Error('La respuesta no es del sistema de obras. Revisa el enlace en Ajustes y que la implementación tenga acceso "Cualquier usuario".'); throw x; }
  if (!j.ok) {
    const x = new Error(String(j.error || 'Error'));
    if (/^SESION/.test(x.message)) { x.auth = true; x.message = 'Tu sesión venció. Ingresa de nuevo.'; }
    if (/^NO_AUTORIZADO/.test(x.message)) { x.auth = true; x.message = 'Tu correo no está autorizado o fue desactivado. Habla con el Administrador.'; }
    if (/^CAMBIAR_CLAVE/.test(x.message)) { x.cambiar = true; x.message = 'Tu contraseña es temporal: crea una nueva para continuar.'; irCambio(true, ''); }
    if (/^SIN_CLAVE/.test(x.message)) { x.sinClave = true; x.message = x.message.replace(/^SIN_CLAVE:\s*/, ''); }
    throw x;
  }
  return j.data;
}
async function withBusy(fn) {
  S.busy++; renderBusy();
  try { return await fn(); } finally { S.busy--; renderBusy(); }
}
function salirSesion(msg) { S.token = ''; LS.del('token'); S.data = null; S.view = 'login'; S.login.step = 'login'; render(); if (msg) toast(msg, true); }
function irCambio(forzado, actual) { S.login.step = 'cambio'; S.login.forzado = !!forzado; S.login.actual = actual || ''; S.view = 'login'; render(); }

async function cargar(silencioso) {
  if (!S.token) return;
  const cache = LS.get('inicio:' + S.obra, null) || LS.get('inicio:', null);
  if (!S.data && cache) { S.data = cache.d; S.dataFecha = cache.f; }
  if (!navigator.onLine) { render(); return; }
  try {
    const d = silencioso ? await api('inicio', S.obra) : await withBusy(() => api('inicio', S.obra));
    S.data = d; S.dataFecha = hoyLocal(); S.obra = d.obra; LS.set('obra', d.obra); mezclarServidor();
    LS.set('inicio:' + d.obra, { d: d, f: S.dataFecha }); LS.set('inicio:', { d: d, f: S.dataFecha });
    S.err = '';
  } catch (e) {
    if (e.auth) return salirSesion(e.message);
    if (e.cambiar) return;
    if (!e.net) S.err = e.message;
  }
  render();
}

async function contarPend() { S.pend = await OB.all(); renderStatus(); }
async function enqueue(k, fn, args, label, kind) {
  await OB.put({ k: k, fn: fn, args: args, label: label, kind: kind, ts: Date.now(), tries: 0, err: '' });
  await contarPend();
  sync();
}
const PRIO = { sol: 0, parte: 1, foto: 2 };
async function sync() {
  if (S.syncing || !S.token || !S.api || !navigator.onLine) return;
  S.syncing = true; renderStatus();
  let hubo = false;
  try {
    const items = (await OB.all()).sort((a, b) => (PRIO[a.kind] - PRIO[b.kind]) || (a.ts - b.ts));
    for (const it of items) {
      if (it.tries >= 3 && it.err && !it.retry) continue;
      try {
        await api(it.fn, ...it.args);
        const cur = (await OB.all()).filter((x) => x.k === it.k)[0];
        if (cur && cur.ts === it.ts) await OB.del(it.k);
        hubo = true;
      } catch (e) {
        if (e.net) break;
        if (e.auth) { S.syncing = false; return salirSesion(e.message); }
        if (e.cambiar) break;
        it.tries = (it.tries || 0) + 1; it.err = e.message; it.retry = false;
        await OB.put(it);
      }
    }
  } finally {
    S.syncing = false;
    await contarPend();
    if (hubo) { LS.set('lastSync', new Date().toISOString()); await cargar(true); }
  }
}
window.addEventListener('online', () => { S.online = true; renderStatus(); sync(); cargar(true); });
window.addEventListener('offline', () => { S.online = false; renderStatus(); });
setInterval(() => { if (S.pend.length) sync(); }, 30000);
// La pantalla Hoy se actualiza sola cada 2 minutos: así el director ve el avance que el residente acaba de enviar.

/* ---------- parte del día (borrador en el celular) ---------- */
function equiposObra() { const D = S.data; return D ? D.cat.equipos.filter((e) => !e.obra || e.obra === S.obra) : []; }
function draftKey(f) { return 'draft:' + S.obra + ':' + f; }
function draft() {
  const f = hoyLocal();
  let d = LS.get(draftKey(f), null);
  if (d) return d;
  const D = S.data || {};
  const p = D.parteHoy && D.parteHoy.fecha === f ? D.parteHoy : null;
  d = { fecha: f, avance: {}, personal: {}, equipos: {}, clima_m: '', clima_t: '', eventos: [], nov: '', asiento: '', par_h: 0, par_m: '', secciones: [], estado: 'Borrador', fotos: [] };
  if (p) {
    (p.avance || []).forEach((a) => { d.avance[a.plan] = { q: num(a.q), causa: a.causa || '' }; });
    (p.personal || []).forEach((x) => { d.personal[x.cat] = num(x.q); });
    (p.equipos || []).forEach((x) => { if (x.id) d.equipos[x.id] = { est: x.est || (num(x.ht) > 0 ? 'Trabajó' : 'Parado'), ht: num(x.ht) }; });
    Object.assign(d, { clima_m: p.clima_m || '', clima_t: p.clima_t || '', eventos: p.eventos || [], nov: p.nov || '', asiento: p.asiento || '', par_h: num(p.par_h), par_m: p.par_m || '', secciones: p.secciones || [], estado: p.estado || 'Borrador' });
  } else if (D.parteAyer) {
    (D.parteAyer.equipos || []).forEach((x) => { if (x.id) d.equipos[x.id] = { est: x.est || 'Trabajó', ht: num(x.ht) || (D.jornada || 8) }; });
  }
  LS.set(draftKey(f), d);
  return d;
}
// El borrador del celular se pone al día con lo que ya está en el sistema (lo que guardó otro celular o usuario),
// salvo las secciones que se están editando aquí y todavía no se guardaron.
function mezclarServidor() {
  const D = S.data; const f = hoyLocal();
  const p = D && D.parteHoy && D.parteHoy.fecha === f ? D.parteHoy : null;
  if (!p) return;
  const d = LS.get(draftKey(f), null);
  if (!d) return;
  if (S.pend.some((x) => x.k === 'parte:' + S.obra + ':' + f)) return;
  const sucio = d.sucio || {}; const srv = p.secciones || [];
  const toma = (k) => !sucio[k] && srv.indexOf(k) >= 0;
  if (toma('avance')) { d.avance = {}; (p.avance || []).forEach((a) => { d.avance[a.plan] = { q: num(a.q), causa: a.causa || '' }; }); }
  if (toma('personal')) { d.personal = {}; (p.personal || []).forEach((x) => { d.personal[x.cat] = num(x.q); }); }
  if (toma('equipos')) { d.equipos = {}; (p.equipos || []).forEach((x) => { if (x.id) d.equipos[x.id] = { est: x.est || (num(x.ht) > 0 ? 'Trabajó' : 'Parado'), ht: num(x.ht) }; }); }
  if (toma('novedades')) Object.assign(d, { clima_m: p.clima_m || '', clima_t: p.clima_t || '', eventos: p.eventos || [], nov: p.nov || '', asiento: p.asiento || '', par_h: num(p.par_h), par_m: p.par_m || '' });
  srv.forEach((k) => { if (d.secciones.indexOf(k) < 0) d.secciones.push(k); });
  if (p.estado === 'Enviado') d.estado = 'Enviado';
  saveDraft(d);
}
const SECC_DE_VISTA = { avance: 'avance', personal: 'personal', equipos: 'equipos', novedades: 'novedades' };
function marcar(d, k) { if (!k) return; d.sucio = d.sucio || {}; d.sucio[k] = true; }
function fotosHoy(d) {
  const pend = S.pend.filter((x) => x.kind === 'foto' && x.args[0].obra === S.obra && x.args[0].fecha === d.fecha).length;
  const srv = S.data && S.data.parteHoy && S.data.parteHoy.fecha === d.fecha ? num(S.data.parteHoy.nfotos) : 0;
  return pend + srv;
}
function saveDraft(d) { LS.set(draftKey(d.fecha), d); }
function partePayload(d, estado) {
  const D = S.data; const plan = D.plan || []; const J = D.jornada || 8;
  const avance = Object.keys(d.avance).filter((id) => plan.some((p) => p.id === id)).map((id) => ({ plan: id, q: num(d.avance[id].q), causa: d.avance[id].causa || '' }));
  const personal = Object.keys(d.personal).filter((c) => d.personal[c] > 0).map((c) => ({ cat: c, q: d.personal[c], h: J }));
  const equipos = equiposObra().map((e) => {
    const x = d.equipos[e.id] || { est: 'Trabajó', ht: J }; const t = x.est === 'Trabajó';
    return { id: e.id, eq: e.nombre, est: x.est, ht: t ? num(x.ht) : 0, hp: t ? 0 : J, mot: t ? '' : x.est };
  });
  return { obra: S.obra, fecha: d.fecha, clima_m: d.clima_m, clima_t: d.clima_t, eventos: d.eventos, nov: d.nov, asiento: d.asiento,
    par_h: d.eventos.indexOf('Paralización') >= 0 ? num(d.par_h) : '', par_m: d.eventos.indexOf('Paralización') >= 0 ? d.par_m : '',
    personal: personal, equipos: equipos, avance: avance, secciones: d.secciones, estado: estado || d.estado };
}
// Cada sección se envía sola: el sistema conserva las demás como estén (por si otro celular las registró).
// Si todavía hay un envío esperando señal, se juntan las secciones de ambos.
async function soloPendiente(k, nuevas) {
  const prev = (await OB.all()).find((x) => x.k === k);
  const s = (prev && prev.args[0].solo) || [];
  return s.concat(nuevas).filter((v, i, a) => a.indexOf(v) === i);
}
async function guardarSeccion(key) {
  const d = draft();
  if (d.secciones.indexOf(key) < 0) d.secciones.push(key);
  if (d.sucio) delete d.sucio[key];
  saveDraft(d);
  const k = 'parte:' + S.obra + ':' + d.fecha;
  const pl = partePayload(d); pl.solo = await soloPendiente(k, [key]);
  await enqueue(k, 'guardarParte', [pl], 'Parte del ' + fCorta(d.fecha), 'parte');
  S.view = 'hoy'; render();
  toast(navigator.onLine ? 'Guardado.' : 'Guardado en el celular. Se enviará cuando haya señal.');
}
function stepFor(p) {
  const u = String(p.unidad || '').toLowerCase();
  if (['und', 'u', 'pza', 'pzas', 'global', 'glb', 'pieza', 'unidad'].indexOf(u) >= 0) return 1;
  const m = num(p.meta);
  return m >= 200 ? 10 : m >= 50 ? 5 : m >= 8 ? 1 : 0.5;
}

function toast(msg, err) {

  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, err ? 6000 : 3000);
}

function avanceSemanaHtml(D) {
  const plan = (D.plan || []).slice().sort((a, b) => (a.modo === 'Reserva') - (b.modo === 'Reserva'));
  const ph = D.parteHoy && D.parteHoy.fecha === D.hoy ? D.parteHoy : null;
  const est = !ph ? '<span class="tag t-warn">Sin registrar</span>' : ph.estado === 'Enviado' ? '<span class="tag t-ok">Enviado</span>' : `<span class="tag t-n">En borrador · ${(ph.secciones || []).length} de 4</span>`;

        ${C.puede ? `<div class="grid2">${C.causas.map((c) => `<button class="chip sm ${f.causa === c[0] ? 'on' : ''}" data-a="ppcCausa" data-id="${f.id}" data-c="${f.causa === c[0] && f.causaDir ? '' : c[0]}">${esc(c[1])}</button>`).join('')}</div>` : ''}`}

  if (C.restr.length) h += `<div class="card"><h3>Restricciones de la semana</h3>${C.restr.map((r) => `<div class="between" style="align-items:flex-start"><span class="col"><span class="sm b">Falta ${esc(r.cond.toLowerCase())} · ${esc(r.tarea)}</span><span class="xs mut">${esc(r.resp)} · hasta el ${fCorta(r.limite)}</span></span><span class="tag ${r.estado === 'Liberada' ? 't-ok' : 't-warn'}">${esc(r.estado)}</span></div>`).join('')}</div>`;
  h += `<div class="card"><h3>Documento de la semana</h3><span class="sm mut">F-O05-04 Plan semanal y PPC, con F-O05-05 Causas y restricciones. Para la reunión semanal y el archivo de obra.</span>${S.ppcDoc && S.ppcDoc.semana === C.semana ? docLinks(S.ppcDoc.r) : ''}</div>`;
  h += `</div><div class="foot"><button class="btn p" data-a="ppcDoc">${S.ppcDoc && S.ppcDoc.semana === C.semana ? 'Generar de nuevo' : 'Generar documento de PPC'}</button></div></div>`;
  return h;
};

/* ---- programación semanal ---- */
async function abrirProg() {
  if (!navigator.onLine) return toast('La programación necesita señal. Conéctate e intenta de nuevo.', true);
  try {
    const p = await withBusy(() => api('programacion', S.obra));
    S.prog = p;
    if (!S.progSem || !p.semanas.some((w) => w.lunes === S.progSem)) {
      const comp0 = p.plan.some((x) => x.semana === p.semanas[0].lunes && x.comprometido);
      S.progSem = comp0 ? p.semanas[1].lunes : p.semanas[0].lunes;
    }
    S.view = 'prog'; render();
  } catch (e) { if (e.auth) return salirSesion(e.message); toast(e.message, true); }
}
async function progCall(fn, ...args) {
  if (!navigator.onLine) return toast('Sin señal: la programación se guarda solo con conexión.', true);
  try { const p = await withBusy(() => api(fn, ...args)); if (p && p.semanas) S.prog = p; render(); return true; }
  catch (e) { if (e.auth) return salirSesion(e.message); toast(e.message, true); return false; }
}
V.prog = () => {

  let h = `<div class="scr"><div class="top">${back()}<div class="between"><h2>Programación</h2>${P.ppc ? `<span class="tag ${P.ppc.pct >= 70 ? 't-ok' : 't-warn'}">PPC sem. pasada ${P.ppc.pct}%</span>` : ''}</div><span class="sm mut">${esc(obraN)}${can ? '' : ' · solo lectura'}</span>
    <div class="weeks" role="tablist">${P.semanas.map((w, i) => { const n = P.plan.filter((p) => p.semana === w.lunes); const rr = n.filter((p) => !p.libre).length; return `<button role="tab" aria-selected="${w.lunes === sem.lunes}" class="${w.lunes === sem.lunes ? 'on' : ''} ${rr ? 'r' : ''}" data-a="progSem" data-l="${w.lunes}" aria-label="Semana ${w.n}${rr ? ', ' + rr + ' con restricciones' : ''}"><b>${i === 0 ? 'Esta' : 'Sem ' + w.n}</b><span>${fMes(w.lunes)}</span><span>${n.length ? n.length + (n.length === 1 ? ' tarea' : ' tareas') : '—'}</span></button>`; }).join('')}</div>
  </div><div class="body">
    <button class="btn o w" data-a="abrirPPC" data-v="prog">Cierre de semana y PPC</button>
    <div class="between"><span class="sm b">Semana ${sem.n} · ${fMes(sem.lunes)} al ${fMes(sem.sab)}</span>${yaComp ? '<span class="tag t-ok">Comprometida</span>' : ''}</div>
    <p class="xs mut">Las tareas entran con las 7 condiciones listas: toca la que falte. Lo que falta se vuelve restricción con responsable y fecha. Solo una tarea liberada entra al plan.</p>`;
  if (!rows.length) h += `<p class="note n-n">Esta semana no tiene tareas. ${can ? 'Agrégalas desde el plan maestro.' : ''}</p>`;
  rows.forEach((p) => {
    const tag = !p.libre ? `<span class="tag t-warn">${p.restr.length || 1} restr.</span>` : p.modo === 'Comprometida' ? '<span class="tag t-ok">Comprometida</span>' : p.modo === 'Reserva' ? '<span class="tag t-n">Reserva</span>' : p.modo === 'No entra' ? '<span class="tag t-n">No entra</span>' : '<span class="tag t-ok">Liberada</span>';
    h += `<div class="card">
      <div class="between" style="align-items:flex-start"><span class="col"><span class="b">${esc(p.nombre)}</span><span class="xs mut">${esc([p.item ? 'Ítem ' + p.item : '', p.lugar, p.cuadrilla].filter(Boolean).join(' · '))}</span></span>${tag}</div>
      <div class="conds">${P.cond.map((c) => { const ok = p.cond[c[0]] !== false; return `<button class="chip sm ${ok ? 'c-ok' : 'c-no'}" ${can ? '' : 'disabled'} data-a="cond" data-id="${p.id}" data-k="${c[0]}" data-v="${ok ? 0 : 1}" aria-pressed="${ok}" title="${esc(c[1])}: ${ok ? 'lista' : 'falta'}">${esc(COND_CORTO[c[0]] || c[1])}</button>`; }).join('')}</div>
      ${p.restr.map((r) => `<div class="note n-warn between"><span>Falta ${esc(r.cond.toLowerCase())} → ${esc(r.resp)}</span><span>hasta ${fCorta(r.limite)}</span></div>`).join('')}
      <div class="row"><label class="sm mut" style="flex:1" for="m_${p.id}">Meta de la semana</label><input id="m_${p.id}" class="f" style="max-width:110px;text-align:right;font-weight:800" type="number" inputmode="decimal" min="0" value="${num(p.meta) || ''}" placeholder="0" ${can ? '' : 'disabled'} data-i="meta" data-id="${p.id}"><span class="sm b" style="min-width:44px">${esc(p.unidad)}</span></div>
      <div class="seg">${[['Comprometida', 'Comprometer'], ['Reserva', 'Reserva'], ['No entra', 'No entra']].map((m) => `<button class="${p.modo === m[0] ? 'on' + (m[0] === 'Comprometida' ? ' g' : '') : ''}" ${can && p.libre ? '' : 'disabled'} data-a="modo" data-id="${p.id}" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>
      ${(p.modo === 'Comprometida' || p.modo === 'Reserva') && (num(p.hecho) || p.causa || p.comprometido) ? `<div class="bar"><i class="${p.cumplida ? 'g' : ''}" style="width:${num(p.meta) > 0 ? Math.min(100, Math.round(num(p.hecho) / num(p.meta) * 100)) : 0}%"></i></div><span class="xs mut">Avance de la semana: ${fmt(p.hecho)} de ${fmt(p.meta)} ${esc(p.unidad)}${p.cumplida ? ' · cumplida' : ''}${p.causa && !p.cumplida ? ' · causa: ' + esc(causaTxt(p.causa)) : ''}</span>` : ''}
    </div>`;
  });
  if (can) h += `<button class="btn w" data-a="go" data-v="progAdd" style="border-style:dashed">+ Agregar tarea del plan maestro</button>`;
  h += `</div>`;
  if (can) h += `<div class="foot"><span class="xs mut center">${comp.length} comprometidas · ${res.length} de reserva · ${rows.filter((p) => !p.libre).length} con restricciones</span><button class="btn p" data-a="comprometer" ${comp.length ? '' : 'disabled'}>${yaComp ? 'Actualizar el plan comprometido' : 'Comprometer semana ' + sem.n}</button></div>`;
  return h + `</div>`;

  if (!S.api) S.view = 'setup';
  else if (!S.token && S.view !== 'setup') { S.view = 'login'; if (S.login.step === 'cambio') S.login.step = 'login'; }
  const v = V[S.view] ? S.view : 'hoy';
  if (['avance', 'personal', 'equipos', 'novedades', 'cierre'].indexOf(v) >= 0 && (!S.data || !S.data.puede.parte)) S.view = 'hoy';
  if ((v === 'prog' || v === 'progAdd') && !S.prog) S.view = 'hoy';
  if (v === 'ppc' && !S.ppc) S.view = 'hoy';
  if ((v === 'partes' || v === 'parteVer') && !S.hist) S.view = 'hoy';
  if (v === 'sol' && !S.sol) S.view = 'hoy';
  const app = $('#app');
  app.className = S.view === 'prog' || S.view === 'progAdd' || S.view === 'ppc' ? 'wide' : '';
  const keepScroll = S.view === S.prev;
  const y = window.scrollY;
  app.innerHTML = V[S.view]();
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  S.prev = S.view;
}

/* ---------- acciones ---------- */
function upd(fn) { const d = draft(); fn(d); marcar(d, SECC_DE_VISTA[S.view]); saveDraft(d); render(); }
const A = {
  go: (el) => { S.view = el.dataset.v; render(); },

  },

  climaM: (el) => upd((d) => { d.clima_m = d.clima_m === el.dataset.c ? '' : el.dataset.c; }),

  descartar: async (el) => { if (!confirm('¿Descartar este registro? No se enviará al sistema.')) return; await OB.del(el.dataset.k); await contarPend(); render(); },

/* ---------- fotos: se comprimen en el celular y esperan en la cola ---------- */
function pedirGeo() {
  if (S.geo || !navigator.geolocation) return;
  try { navigator.geolocation.getCurrentPosition((p) => { S.geo = { lat: p.coords.latitude, lng: p.coords.longitude }; }, () => { }, { timeout: 8000, maximumAge: 600000 }); } catch (e) { }
}
function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 1600; let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la foto.')); };
    img.src = url;
  });
}
$('#cam').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []); if (!files.length) return;
  const d = draft();
  for (const f of files) {
    try {
      const data = await comprimir(f); const cid = newId();
      await OB.put({ k: 'foto:' + cid, fn: 'subirFoto', args: [{ cid: cid, obra: S.obra, fecha: d.fecha, b64: data, nota: '', lat: S.geo ? S.geo.lat : '', lng: S.geo ? S.geo.lng : '' }], label: 'Foto del ' + fCorta(d.fecha), kind: 'foto', ts: Date.now(), tries: 0, err: '' });
      d.fotos.push(cid);
      const th = $('#thumbs'); if (th) { const im = document.createElement('img'); im.src = data; im.alt = 'Foto tomada'; th.appendChild(im); }
    } catch (x) { toast(x.message, true); }
  }
  saveDraft(d); await contarPend(); sync();
  const b = document.querySelector('[data-a="foto"]'); if (b) b.innerHTML = CAM + ' Tomar foto · ' + fotosHoy(d) + ' hoy';
  toast(files.length === 1 ? 'Foto guardada.' : files.length + ' fotos guardadas.');
});

(function limpiar() { const lim = addDays(hoyLocal(), -5); LS.keys().filter((k) => k.indexOf('draft:') === 0 && k.slice(-10) < lim).forEach((k) => LS.del(k)); })();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
render();
contarPend().then(() => { if (S.token && S.api) { cargar(); sync(); } });
